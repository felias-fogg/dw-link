site_name: dw-link
repo_url: https://github.com/felias-fogg/dw-link
repo_name: GitHub

theme:
  name: readthedocs
  locale: en
#  logo: pics/uno-debug2-small.png
  include_homepage_in_sidebar: True
  title: dw-link
  author: Bernhard Nebel
  date: 26-Aug-2025

extra_css:
  - style.css

plugins:
  - search

markdown_extensions:
  - admonition

nav:
  - Quickstart: 'quickstart.md'
  - Usage:
    - Background: 'intro.md'
    - Hardware requirements: 'requirements.md'
    - Installation: 'installation.md'
    - Hardware setup: 'setup.md'
    - A better hardware debugger: 'better.md'
  - About:
    - License: 'LICENSE.txt'
    - Acknowledgements: 'acknowledgements.md'
    - Document revision history: 'history.md'
